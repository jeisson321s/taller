<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen · Sistema de Inventario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d2b2a; --paper:#f3f5f2; --accent:#0f766e; --warn:#b45309; }
  body { font-family:'Figtree',system-ui,sans-serif; background:var(--paper); color:var(--ink); }
  .sidebar { width:230px; background:var(--ink); color:#dfe7e4; min-height:100vh; position:fixed; inset:0 auto 0 0; padding:1.25rem; }
  .sidebar a { color:#b7c6c2; text-decoration:none; display:block; padding:.55rem .7rem; border-radius:.4rem; }
  .sidebar a.active, .sidebar a:hover { background:#2b3f3d; color:#fff; }
  main { margin-left:230px; padding:1.5rem 2rem; }
  .kpi { background:#fff; border-left:4px solid var(--accent); border-radius:.4rem; padding:1rem 1.25rem; }
  .kpi small { color:#5d6e6a; } .kpi h3 { margin:0; font-weight:700; }
  .panel { background:#fff; border-radius:.4rem; padding:1.25rem; }
  @media (max-width:850px){ .sidebar{position:static;width:100%;min-height:0} main{margin-left:0;padding:1rem} }
</style>
</head>
<body>

<aside class="sidebar">
  <h5 class="mb-4"><i class="bi bi-box-seam"></i> Inventario</h5>
  <a href="resumen.html" class="active"><i class="bi bi-speedometer2 me-2"></i>Resumen</a>
  <a href="productos.html"><i class="bi bi-table me-2"></i>Productos</a>
  <a href="historial.html"><i class="bi bi-clock-history me-2"></i>Historial</a>
  <hr>
  <div class="small text-truncate" id="userEmail"></div>
  <button id="btnLogout" class="btn btn-sm btn-outline-light mt-2 w-100">Cerrar sesión</button>
</aside>

<main>
  <h3 class="mb-3">Resumen General</h3>
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3"><div class="kpi"><small>Total Productos</small><h3 id="kProd">0</h3></div></div>
    <div class="col-6 col-lg-3"><div class="kpi"><small>Unidades en Stock</small><h3 id="kStock">0</h3></div></div>
    <div class="col-6 col-lg-3"><div class="kpi"><small>Valor Inventario</small><h3 id="kValor">$0</h3></div></div>
    <div class="col-6 col-lg-3"><div class="kpi" style="border-color:var(--warn)"><small>Stock bajo (&lt; 5)</small><h3 id="kBajo">0</h3></div></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-6"><div class="panel"><h6>Unidades por Categoría</h6><canvas id="chBar" height="170"></canvas></div></div>
    <div class="col-lg-6"><div class="panel"><h6>Valor por Categoría</h6><canvas id="chPie" height="170"></canvas></div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsonVhmr99_bMIHDf-wuDM73Mlf-6_b-8",
  authDomain: "taller-cf180.firebaseapp.com",
  projectId: "taller-cf180",
  storageBucket: "taller-cf180.firebasestorage.app",
  messagingSenderId: "257239791272",
  appId: "1:257239791272:web:f57050863e106f5533349d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const money = n => "$" + Number(n).toLocaleString("es-CO", { maximumFractionDigits: 2 });

let chBar, chPie;

onAuthStateChanged(auth, user => {
  if (!user) {
    window.location.href = "index.html";
  } else {
    $("userEmail").textContent = user.email;
    const q = query(collection(db, "productos"));
    onSnapshot(q, snap => {
      const productos = snap.docs.map(d => d.data());
      renderMetrics(productos);
    });
  }
});

$("btnLogout").onclick = () => signOut(auth).then(() => window.location.href = "index.html");

function renderMetrics(productos) {
  $("kProd").textContent = productos.length;
  $("kStock").textContent = productos.reduce((a, p) => a + p.stock, 0);
  $("kValor").textContent = money(productos.reduce((a, p) => a + p.stock * p.precio, 0));
  $("kBajo").textContent = productos.filter(p => p.stock < 5).length;

  const unidades = {}, valor = {};
  productos.forEach(p => {
    unidades[p.categoria] = (unidades[p.categoria] || 0) + p.stock;
    valor[p.categoria] = (valor[p.categoria] || 0) + p.stock * p.precio;
  });

  const labels = Object.keys(unidades);
  const colores = ["#0f766e","#b45309","#4f6d7a","#a3b18a","#8c5e58","#6b7280"];
  
  chBar?.destroy(); chPie?.destroy();
  chBar = new Chart($("chBar"), { 
    type:"bar", 
    data:{ labels, datasets:[{ data:Object.values(unidades), backgroundColor:"#0f766e" }] }, 
    options:{ plugins:{ legend:{ display:false } } } 
  });
  chPie = new Chart($("chPie"), { 
    type:"doughnut", 
    data:{ labels, datasets:[{ data:Object.values(valor), backgroundColor:colores }] } 
  });
}
</script>
</body>
</html>
