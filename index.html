<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · Sistema de Inventario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d2b2a; --paper:#f3f5f2; --accent:#0f766e; }
  body { font-family:'Figtree',system-ui,sans-serif; background:var(--paper); color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .panel { background:#fff; border-radius:.5rem; padding:2rem; width:100%; max-width:400px; }
  .btn-accent { background:var(--accent); color:#fff; } .btn-accent:hover { background:#0b5f58; color:#fff; }
</style>
</head>
<body>

<div class="panel shadow-sm">
  <h4 class="mb-1">Bienvenido</h4>
  <p class="text-secondary small mb-3">Inicia sesión o regístrate para acceder al panel.</p>
  <div class="mb-2">
    <label class="form-label small">Correo electrónico</label>
    <input id="email" type="email" class="form-control" placeholder="ejemplo@correo.com">
  </div>
  <div class="mb-3">
    <label class="form-label small">Contraseña</label>
    <input id="pass" type="password" class="form-control" placeholder="Mínimo 6 caracteres">
  </div>
  <div class="d-flex gap-2">
    <button id="btnLogin" class="btn btn-accent flex-fill">Entrar</button>
    <button id="btnRegister" class="btn btn-outline-secondary flex-fill">Crear cuenta</button>
  </div>
  <div id="loginMsg" class="text-danger small mt-3"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsonVhmr99_bMIHDf-wuDM73Mlf-6_b-8",
  authDomain: "taller-cf180.firebaseapp.com",
  projectId: "taller-cf180",
  storageBucket: "taller-cf180.firebasestorage.app",
  messagingSenderId: "257239791272",
  appId: "1:257239791272:web:f57050863e106f5533349d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const $ = id => document.getElementById(id);

const errores = {
  "auth/invalid-credential":"Correo o contraseña incorrectos.",
  "auth/email-already-in-use":"Ese correo ya está registrado.",
  "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
  "auth/invalid-email":"El correo ingresado no es válido."
};

const authAction = fn => async () => {
  $("loginMsg").textContent = "";
  try { 
    await fn(auth, $("email").value.trim(), $("pass").value);
    window.location.href = "resumen.html";
  } catch (e) { $("loginMsg").textContent = errores[e.code] || e.message; }
};

$("btnLogin").onclick = authAction(signInWithEmailAndPassword);
$("btnRegister").onclick = authAction(createUserWithEmailAndPassword);

onAuthStateChanged(auth, user => {
  if (user) window.location.href = "resumen.html";
});
</script>
</body>
</html>
